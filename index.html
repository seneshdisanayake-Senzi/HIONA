<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIONA Clothing | Women’s Fashion Sri Lanka</title>
<meta name="description" content="Modern, elegant and affordable women’s fashion with islandwide delivery across Sri Lanka.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#faf6f0;--sur:#fff;--beige:#e9dfd0;--pink:#f2d6d3;--ink:#161313;--mut:#6f655c;--ln:#e4d9ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171413;--sur:#211d1b;--beige:#2d2723;--pink:#4a3535;--ink:#f6efe6;--mut:#b3a79b;--ln:#372f2a;color-scheme:dark}}
*{box-sizing:inherit}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.1}
h1{font-size:clamp(2.6rem,7vw,5.2rem)}h2{font-size:clamp(1.8rem,4vw,2.7rem)}h3{font-size:1.25rem}
a{color:inherit}img,svg{max-width:100%;display:block}
.wrap{max-width:1180px;margin:auto;padding:0 20px}.sec{padding:64px 0}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;gap:18px;height:62px}
.logo{font-size:1.7rem;letter-spacing:.18em;cursor:pointer;font-weight:600}
.nav nav{display:flex;gap:18px;margin-left:auto;align-items:center}
.nav a,.lk{cursor:pointer;text-decoration:none;background:none;border:0;color:inherit;font:inherit;padding:4px 0}
.nav a:hover,.lk:hover{color:var(--mut)}
.cnt{background:var(--ink);color:var(--bg);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:3px}
@media(max-width:760px){.nav{flex-wrap:wrap;height:auto;padding:10px 0;gap:6px 14px}.nav nav{margin:0;width:100%;overflow-x:auto;gap:16px;white-space:nowrap}}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 26px;font:500 14px Jost,sans-serif;letter-spacing:.06em;cursor:pointer;transition:.2s}
.btn:hover{background:transparent;color:var(--ink)}.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{background:var(--ink);color:var(--bg)}
.btn.s{padding:7px 14px;font-size:13px}.btn[disabled]{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);background:var(--sur);color:var(--ink);font:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;min-height:78vh}
.hero p{max-width:440px;color:var(--mut);font-size:17px;margin:18px 0 28px}
.hero .art{background:var(--pink);aspect-ratio:4/5;position:relative;overflow:hidden;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:0;padding:30px 0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{cursor:pointer;position:relative}.card .im{aspect-ratio:3/4;overflow:hidden;background:var(--beige)}
.card .im>*{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .im>*{transform:scale(1.04)}
.card h3{font-size:1.1rem;margin-top:10px}.pr s{color:var(--mut);margin-right:8px;font-size:13px}
.bd{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-size:11px;padding:2px 8px}
.hrt{position:absolute;top:8px;right:8px;background:var(--sur);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.hd{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:12px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{aspect-ratio:4/5;position:relative;cursor:pointer;overflow:hidden}.tile .ov{position:absolute;inset:auto 0 0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff}
.band{background:var(--pink);text-align:center;padding:56px 20px}.band .code{display:inline-block;border:1px dashed var(--ink);padding:6px 16px;margin:14px 0;letter-spacing:.2em}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.rev div{background:var(--sur);padding:24px;border:1px solid var(--ln)}
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ig>*{aspect-ratio:1;overflow:hidden}
@media(max-width:760px){.cols{grid-template-columns:1fr}.ig{grid-template-columns:repeat(3,1fr)}}
footer{background:var(--ink);color:#e9dfd0;padding:50px 0 24px;margin-top:40px}footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
footer h3{margin-bottom:10px;color:#fff}footer a{display:block;color:#cfc3b3;text-decoration:none;cursor:pointer;margin:4px 0}
.shop{display:grid;grid-template-columns:230px 1fr;gap:30px}@media(max-width:820px){.shop{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}.chip{border:1px solid var(--ln);background:var(--sur);color:var(--ink);padding:6px 14px;white-space:nowrap;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--ink);color:var(--bg)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:760px){.pd{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.box{background:var(--sur);border:1px solid var(--ln);padding:22px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}.tw{overflow-x:auto}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}.row .th{width:70px;flex:none;aspect-ratio:3/4;overflow:hidden}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:560px){.f2{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi b{display:block;font:500 1.9rem 'Cormorant Garamond',serif}
.bar{height:14px;background:var(--ink);margin:4px 0 10px}
.step{display:flex;gap:12px;margin:10px 0;color:var(--mut)}.step.d{color:var(--ink)}.step i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none;margin-top:5px}.step.d i{background:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 22px;opacity:0;transition:.3s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;text-decoration:none;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mut{color:var(--mut)}.ct{text-align:center}.sm{font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="wrap nav"><div class="logo" onclick="go('home')">HIONA</div>
<nav><a onclick="go('shop',{cat:'All'})">Shop</a><a onclick="go('shop',{cat:'New Arrivals'})">New</a><a onclick="go('shop',{cat:'Sale'})">Sale</a><a onclick="go('track')">Track order</a><a onclick="go('contact')">Contact</a>
<button class="lk" onclick="go('wishlist')" aria-label="Wishlist">♡<span class="cnt" id="wc">0</span></button>
<button class="lk" onclick="go('cart')" aria-label="Cart">Bag<span class="cnt" id="cc">0</span></button>
<button class="lk" onclick="go('account')" id="acc">Sign in</button></nav></div></header>
<main id="app"></main>
<a class="wa" id="wab" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">✆</a>
<div id="toast"></div>
<footer><div class="wrap"><div><div class="logo" style="color:#fff;font-size:1.6rem">HIONA</div><p class="sm">Modern, elegant, affordable women’s fashion. Islandwide delivery across Sri Lanka.</p></div>
<div><h3>Shop</h3><a onclick="go('shop',{cat:'Dresses'})">Dresses</a><a onclick="go('shop',{cat:'Co-ord Sets'})">Co-ord sets</a><a onclick="go('shop',{cat:'Party Wear'})">Party wear</a><a onclick="go('shop',{cat:'Sale'})">Sale</a></div>
<div><h3>Help</h3><a onclick="go('track')">Track your order</a><a onclick="go('contact')">Delivery &amp; returns</a><a onclick="go('contact')">Contact us</a></div>
<div><h3>Follow</h3><a href="https://facebook.com/hionaclothing" target="_blank" rel="noopener">Facebook</a><a href="https://instagram.com/hionaclothing" target="_blank" rel="noopener">Instagram</a><a id="wal" target="_blank" rel="noopener">WhatsApp</a></div></div>
<div class="wrap sm" style="display:block;margin-top:26px;color:#9b8f81">© 2026 HIONA Clothing. All prices in LKR.</div></footer>
<script>
const WA='94770000000',CATS=['New Arrivals','Dresses','Tops & Blouses','T-Shirts','Shirts','Jeans & Pants','Skirts','Co-ord Sets','Casual Wear','Party Wear','Sale'];
const HEX={Ivory:'#f3ead8',Beige:'#d8c3a5',Blush:'#eab9b4',Black:'#1b1818',White:'#fbfaf7',Sage:'#a9b59a',Navy:'#2d3a55',Denim:'#5c7596',Rose:'#c9777f',Mocha:'#7a5a47',Wine:'#6d2634'};
const DIST=['Colombo','Gampaha','Kalutara','Kandy','Galle','Matara','Kurunegala','Negombo area','Jaffna','Anuradhapura','Ratnapura','Badulla','Nuwara Eliya','Matale','Hambantota','Trincomalee','Batticaloa','Ampara','Puttalam','Kegalle','Polonnaruwa','Monaragala','Kilinochchi','Mannar','Vavuniya','Mullaitivu'];
const STAT=['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'];
const $=s=>document.querySelector(s),LK=n=>'LKR '+Math.round(n).toLocaleString('en-LK'),eff=p=>p.sale||p.price,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SZ=['S','M','L','XL','XXL'];
function seed(){const b=[['Aurelia Wrap Dress','Dresses',8900,6990,['Rose','Black','Sage'],1,1],['Ivory Satin Slip Dress','Party Wear',12500,0,['Ivory','Wine'],1,0],['Linen Midi Dress','Dresses',7800,0,['Beige','Sage'],0,1],['Noor Puff Sleeve Blouse','Tops & Blouses',4200,3400,['White','Blush'],1,1],['Silk Touch Cami Top','Tops & Blouses',3600,0,['Black','Ivory'],0,0],['Everyday Boxy Tee','T-Shirts',2400,0,['White','Black','Beige'],0,1],['Graphic Cropped Tee','T-Shirts',2200,1790,['Blush','White'],1,0],['Oxford Relaxed Shirt','Shirts',4900,0,['White','Denim'],0,1],['Striped Poplin Shirt','Shirts',4600,3900,['Navy','White'],1,0],['High Rise Straight Jeans','Jeans & Pants',7200,0,['Denim','Black'],0,1],['Wide Leg Trousers','Jeans & Pants',6400,5200,['Black','Mocha','Beige'],0,0],['Pleated Midi Skirt','Skirts',5200,0,['Sage','Black'],1,0],['A-Line Denim Skirt','Skirts',4800,3900,['Denim'],0,0],['Savanna Co-ord Set','Co-ord Sets',11900,9500,['Beige','Sage'],1,1],['Linen Shirt & Short Set','Co-ord Sets',9800,0,['Ivory','Mocha'],1,0],['Weekend Lounge Set','Casual Wear',6900,0,['Blush','Beige'],0,0],['Soft Knit Casual Dress','Casual Wear',6200,4900,['Mocha','Black'],0,1],['Midnight Sequin Dress','Party Wear',15900,0,['Black','Wine'],1,0],['Rosette Evening Gown','Party Wear',18900,14900,['Rose','Wine'],0,1],['Tailored Blazer Top','Tops & Blouses',7400,0,['Black','Beige'],1,0]];
return b.map((x,i)=>({id:i+1,name:x[0],cat:x[1],price:x[2],sale:x[3],colors:x[4],sizes:i%4==3?['S','M','L']:SZ,stock:6+(i*7)%30,desc:'Cut from soft, breathable fabric for all-day comfort in Sri Lanka’s climate. A flattering fit designed to move with you, finished with careful stitching.',new:!!x[5],best:!!x[6]}))}
let mem=null;function load(){try{const r=localStorage.getItem('hiona');if(r)return JSON.parse(r)}catch(e){}return mem}
let D=load()||{products:seed(),orders:[],users:[{id:1,name:'Store Owner',email:'admin@hiona.lk',ph:'',role:'admin',pw:'__admin'}],cart:[],wish:[],promos:[{code:'HIONA10',pct:10,on:true}],me:null,seq:1000};
function save(){mem=D;try{localStorage.setItem('hiona',JSON.stringify(D))}catch(e){toast('Storage full: use smaller images')}}
async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hiona'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{const a=D.users[0];if(a.pw==='__admin'){a.pw=await H('admin123');save()}})();
let ST={cat:'All',q:'',max:20000,size:'',col:'',sort:'new',pid:null,adm:'overview',edit:null,promo:null,oid:null,sel:{}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function go(v,o){Object.assign(ST,o||{});if(location.hash==='#'+v)render();else location.hash=v;scrollTo(0,0)}
function art(p,big){if(p.img)return`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`;const c=HEX[p.colors[0]]||'#ccc',bg=['#efe3d3','#f2d6d3','#e5ddd0','#e8d4cf'][p.id%4],d=p.cat;
let s=/Dress|Party|Casual/.test(d)&&!/Set/.test(d)?'<path d="M82 34h36l6 56 38 140H38l38-140z"/><path d="M82 34q18 22 36 0" fill="none" stroke="#0003"/>':/Skirt/.test(d)?'<path d="M72 60h56l38 160H34z"/>':/Pants/.test(d)?'<path d="M70 40h60l10 190h-32l-8-120-8 120H60z"/>':/Co-ord/.test(d)?'<path d="M72 40h56l30 40-18 14-12-8v50H72V86l-12 8-18-14z"/><path d="M76 160h48l36 70H40z"/>':'<path d="M70 40h60l36 42-20 18-16-10v80H70V90l-16 10-20-18z"/>';
return`<svg viewBox="0 0 200 260" role="img" aria-label="${esc(p.name)}" preserveAspectRatio="xMidYMid slice"><rect width="200" height="260" fill="${bg}"/><circle cx="100" cy="130" r="92" fill="#fff" opacity=".35"/><g fill="${c}" stroke="#0002" stroke-width="1">${s}</g></svg>`}
function card(p){const w=D.wish.includes(p.id),off=p.sale?Math.round(100-p.sale/p.price*100):0;return`<div class="card"><div class="im" onclick="go('product',{pid:${p.id}})">${art(p)}</div>${p.stock<1?'<span class="bd">Sold out</span>':off?`<span class="bd">-${off}%</span>`:p.new?'<span class="bd">New</span>':''}<button class="hrt" aria-label="Wishlist" onclick="wish(${p.id})">${w?'♥':'♡'}</button><h3 onclick="go('product',{pid:${p.id}})">${esc(p.name)}</h3><div class="pr">${p.sale?`<s>${LK(p.price)}</s>`:''}${LK(eff(p))}</div></div>`}
function wish(id){const i=D.wish.indexOf(id);i<0?D.wish.push(id):D.wish.splice(i,1);save();render();toast(i<0?'Added to wishlist':'Removed from wishlist')}
function add(id,buy){const p=D.products.find(x=>x.id==id),s=ST.sel[id]||{};if(!s.size||!s.col)return toast('Choose a size and colour');if(p.stock<1)return toast('Out of stock');
const l=D.cart.find(x=>x.id==id&&x.size==s.size&&x.col==s.col);l?l.q++:D.cart.push({id,size:s.size,col:s.col,q:1});save();badge();buy?go('checkout'):toast('Added to bag')}
function badge(){$('#cc').textContent=D.cart.reduce((a,l)=>a+l.q,0);$('#wc').textContent=D.wish.length;const u=D.users.find(u=>u.id==D.me);$('#acc').textContent=u?u.name.split(' ')[0]:'Sign in';$('#wab').href=$('#wal').href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hi HIONA Clothing, I need help with an order.')}
function totals(dist){const sub=D.cart.reduce((a,l)=>a+eff(D.products.find(p=>p.id==l.id))*l.q,0),pr=D.promos.find(x=>x.code==ST.promo&&x.on),disc=pr?Math.round(sub*pr.pct/100):0;const fee=!D.cart.length||sub-disc>=15000?0:['Colombo','Gampaha','Kalutara'].includes(dist||'Colombo')?350:550;return{sub,disc,fee,tot:sub-disc+fee}}
const V={};
V.home=()=>{const P=D.products,n=P.filter(p=>p.new).slice(0,4),b=P.filter(p=>p.best).slice(0,4),h=P.find(p=>p.id==14);return`
<div class="wrap hero"><div><h1>Discover Your Style, Define Your Elegance.</h1><p>Modern, trend-led pieces at prices that feel kind. Delivered islandwide, with cash on delivery.</p><button class="btn" onclick="go('shop',{cat:'All'})">Shop now</button> <button class="btn o" onclick="go('shop',{cat:'New Arrivals'})">New arrivals</button></div><div class="art">${art(h)}</div></div>
<div class="wrap sec"><div class="hd"><h2>New arrivals</h2><a class="lk" onclick="go('shop',{cat:'New Arrivals'})">View all</a></div><div class="grid">${n.map(card).join('')}</div></div>
<div class="wrap sec"><div class="hd"><h2>Featured collections</h2></div><div class="cols">${[['Dresses',2],['Co-ord Sets',14],['Party Wear',18]].map(([c,i])=>`<div class="tile" onclick="go('shop',{cat:'${c}'})">${art(P.find(p=>p.id==i))}<div class="ov"><h3>${c}</h3><span class="sm">Shop the edit</span></div></div>`).join('')}</div></div>
<div class="band"><h2>First order? Take 10% off.</h2><div class="code">HIONA10</div><p class="mut">Enter at checkout. Free delivery on orders over LKR 15,000.</p><button class="btn" onclick="go('shop',{cat:'Sale'})">Shop sale</button></div>
<div class="wrap sec"><div class="hd"><h2>Best sellers</h2></div><div class="grid">${b.map(card).join('')}</div></div>
<div class="wrap sec"><div class="hd"><h2>Loved by our customers</h2></div><div class="rev">${[['The fit is perfect and the fabric feels so soft. Arrived in Kandy in two days.','Nethmi P.'],['Ordered the co-ord set for a family function. So many compliments!','Sachini R.'],['Easy sizing, quick WhatsApp replies and cash on delivery. Will order again.','Dilini F.']].map(r=>`<div><p>“${r[0]}”</p><b class="sm">${r[1]}</b></div>`).join('')}</div></div>
<div class="wrap sec"><div class="hd"><h2>Shop our Instagram</h2><a class="lk" href="https://instagram.com/hionaclothing" target="_blank" rel="noopener">@hionaclothing</a></div><div class="ig">${P.slice(0,6).map(p=>`<div onclick="go('product',{pid:${p.id}})" style="cursor:pointer">${art(p)}</div>`).join('')}</div></div>
<div class="wrap sec ct"><h2>Join the HIONA list</h2><p class="mut">New drops and private offers, straight to your inbox.</p><form onsubmit="event.preventDefault();this.reset();toast('You’re subscribed')" style="display:flex;gap:8px;max-width:440px;margin:18px auto 0"><input type="email" required placeholder="Email address" aria-label="Email"><button class="btn">Subscribe</button></form></div>`};
V.shop=()=>{let L=D.products.filter(p=>{const c=ST.cat;return(c=='All'||(c=='New Arrivals'?p.new:c=='Sale'?p.sale:p.cat==c))&&eff(p)<=ST.max&&(!ST.size||p.sizes.includes(ST.size))&&(!ST.col||p.colors.includes(ST.col))&&(!ST.q||(p.name+p.cat).toLowerCase().includes(ST.q.toLowerCase()))});
L.sort((a,b)=>ST.sort=='lo'?eff(a)-eff(b):ST.sort=='hi'?eff(b)-eff(a):ST.sort=='az'?a.name.localeCompare(b.name):b.id-a.id);
return`<div class="wrap sec"><h2>${ST.cat=='All'?'All products':ST.cat}</h2><div class="chips" style="margin-top:18px">${['All',...CATS].map(c=>`<button class="chip ${c==ST.cat?'on':''}" onclick="go('shop',{cat:'${c}'})">${c}</button>`).join('')}</div>
<div class="shop"><aside><label>Search</label><input value="${esc(ST.q)}" placeholder="Search dresses, tops…" oninput="ST.q=this.value;clearTimeout(window._s);window._s=setTimeout(()=>{render();$('input[placeholder^=Search]').focus()},300)">
<label>Max price: ${LK(ST.max)}</label><input type="range" min="2000" max="20000" step="500" value="${ST.max}" onchange="ST.max=+this.value;render()">
<label>Size</label><select onchange="ST.size=this.value;render()"><option value="">All sizes</option>${SZ.map(s=>`<option ${s==ST.size?'selected':''}>${s}</option>`).join('')}</select>
<label>Colour</label><select onchange="ST.col=this.value;render()"><option value="">All colours</option>${Object.keys(HEX).map(s=>`<option ${s==ST.col?'selected':''}>${s}</option>`).join('')}</select>
<label>Sort by</label><select onchange="ST.sort=this.value;render()">${[['new','Newest'],['lo','Price: low to high'],['hi','Price: high to low'],['az','Name A–Z']].map(o=>`<option value="${o[0]}" ${o[0]==ST.sort?'selected':''}>${o[1]}</option>`).join('')}</select></aside>
<div>${L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<p class="mut">No products match these filters. Try widening the price or clearing a filter.</p>'}</div></div></div>`};

function render2(){const t=totals(ST.dist),s=$('#sum');if(s)s.innerHTML=`<h3>Order summary</h3>${D.cart.map(l=>{const p=D.products.find(x=>x.id==l.id);return`<p class="sm">${l.q} × ${esc(p.name)} (${l.size}, ${l.col})<br>${LK(eff(p)*l.q)}</p>`}).join('')}<p>Subtotal: ${LK(t.sub)}</p>${t.disc?`<p>Discount: −${LK(t.disc)}</p>`:''}<p>Delivery: ${t.fee?LK(t.fee):'Free'}</p><h3>Total: ${LK(t.tot)}</h3><a class="btn o s" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Hi HIONA, I would like to order:\n'+D.cart.map(l=>l.q+' x '+D.products.find(p=>p.id==l.id).name+' ('+l.size+', '+l.col+')').join('\n')+'\nTotal: '+LK(t.tot))}">Order via WhatsApp</a>`}
function place(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),t=totals(f.dist);
for(const l of D.cart){const p=D.products.find(x=>x.id==l.id);if(p.stock<l.q)return toast(p.name+' has only '+p.stock+' left')}
const run=()=>{D.cart.forEach(l=>{D.products.find(x=>x.id==l.id).stock-=l.q});const o={id:'HC'+(++D.seq),date:Date.now(),cust:f,items:D.cart.map(l=>({...l,name:D.products.find(p=>p.id==l.id).name,price:eff(D.products.find(p=>p.id==l.id))})),...t,pay:f.pay,paid:f.pay=='card',status:'Pending',user:D.me,log:[['Pending',Date.now()]]};D.orders.unshift(o);D.cart=[];ST.promo=null;save();badge();go('confirm',{oid:o.id})};
if(f.pay=='card'){if(confirm('PayHere demo: simulate a successful card payment of '+LK(t.tot)+'?\n(Connect your PayHere merchant ID on a live server for real payments.)'))run()}else run()}
V.confirm=()=>{const o=D.orders.find(x=>x.id==ST.oid);if(!o)return V.home();return`<div class="wrap sec ct"><h1 style="font-size:3rem">Thank you, ${esc(o.cust.name.split(' ')[0])}.</h1><p>Your order <b>${o.id}</b> is placed. Total ${LK(o.tot)} (${o.pay=='cod'?'cash on delivery':o.pay=='bank'?'bank transfer, send your slip on WhatsApp':'paid online'}).</p><p class="mut">Keep your order number and phone to track delivery.</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Hi HIONA, my order '+o.id+' is placed. Total '+LK(o.tot))}">Confirm on WhatsApp</a> <button class="btn o" onclick="go('track',{oid:'${o.id}'})">Track order</button></div>`};
V.track=()=>{const o=D.orders.find(x=>x.id==(ST.tid||'').toUpperCase()&&x.cust.ph.replace(/\D/g,'').slice(-9)==(ST.tph||'').replace(/\D/g,'').slice(-9)),i=o?STAT.indexOf(o.status):0;return`<div class="wrap sec" style="max-width:640px"><h2 style="margin-bottom:16px">Track your order</h2><form onsubmit="event.preventDefault();ST.tid=this.oid.value.trim();ST.tph=this.ph.value;ST.tried=1;render()"><label>Order number</label><input name="oid" required placeholder="HC1001" value="${esc(ST.tid||ST.oid||'')}"><label>Phone number used at checkout</label><input name="ph" required value="${esc(ST.tph||'')}"><br><br><button class="btn">Track</button></form>
${o?`<div class="box" style="margin-top:22px"><b>${o.id}</b> · ${LK(o.tot)}<br><br>${o.status=='Cancelled'?'<p>This order was cancelled.</p>':['Pending','Confirmed','Packed','Shipped','Delivered'].map((s,k)=>`<div class="step ${k<=i?'d':''}"><i></i><span>${s}</span></div>`).join('')}</div>`:ST.tried?'<p class="mut" style="margin-top:18px">No order found. Check the order number and phone number.</p>':''}</div>`};
V.account=()=>{const u=D.users.find(u=>u.id==D.me);if(u){const mine=D.orders.filter(o=>o.user==u.id);return`<div class="wrap sec"><div class="hd"><h2>Hello, ${esc(u.name)}</h2><div>${u.role=='admin'?'<button class="btn s" onclick="go(\'admin\')">Admin dashboard</button> ':''}<button class="btn o s" onclick="D.me=null;save();badge();go('home')">Sign out</button></div></div><h3>Your orders</h3>${mine.length?`<div class="tw"><table><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr>${mine.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.date).toLocaleDateString()}</td><td>${LK(o.tot)}</td><td>${o.status}</td></tr>`).join('')}</table></div>`:'<p class="mut">No orders yet.</p>'}</div>`}
const reg=ST.reg;return`<div class="wrap sec" style="max-width:440px"><h2 style="margin-bottom:10px">${reg?'Create account':'Sign in'}</h2><form onsubmit="auth(event)">${reg?'<label>Full name</label><input name="name" required><label>Phone</label><input name="ph">':''}<label>Email</label><input name="email" type="email" required><label>Password</label><input name="pw" type="password" required minlength="6"><br><br><button class="btn" style="width:100%">${reg?'Create account':'Sign in'}</button></form><p class="sm mut">${reg?'Have an account?':'New here?'} <a href="#account" onclick="ST.reg=${!reg}">${reg?'Sign in':'Create an account'}</a></p><p class="sm mut">Store owner? Sign in with your admin email to open the dashboard.</p></div>`};
async function auth(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),h=await H(f.pw),em=f.email.toLowerCase();
if(ST.reg){if(D.users.some(u=>u.email==em))return toast('Email already registered');const u={id:Date.now(),name:f.name,email:em,ph:f.ph||'',role:'customer',pw:h};D.users.push(u);D.me=u.id}
else{const u=D.users.find(u=>u.email==em&&u.pw==h);if(!u)return toast('Incorrect email or password');D.me=u.id}
save();badge();toast('Welcome');go(D.users.find(u=>u.id==D.me).role=='admin'?'admin':'account')}
V.contact=()=>`<div class="wrap sec"><h2 style="margin-bottom:22px">Contact &amp; policies</h2><div class="two"><div><div class="box"><h3>Message us</h3><form onsubmit="event.preventDefault();this.reset();toast('Message sent. We reply within 24 hours')"><label>Name</label><input required><label>Email or phone</label><input required><label>Message</label><textarea rows="4" required></textarea><br><br><button class="btn">Send message</button></form></div>
<div class="box"><h3>Delivery</h3><p class="sm">Islandwide delivery in 2–4 working days. LKR 350 within Colombo, Gampaha and Kalutara, LKR 550 elsewhere. Free on orders over LKR 15,000. Cash on delivery available everywhere.</p><h3>Returns &amp; exchanges</h3><p class="sm">Unworn items with tags can be exchanged within 7 days of delivery. Sale items are exchange-only.</p></div></div>

const T=[['overview','Sales report'],['products','Products'],['orders','Orders'],['customers','Customers'],['promos','Offers']];
return`<div class="wrap sec"><h2>Dashboard</h2><div class="tabs">${T.map(t=>`<button class="chip ${ST.adm==t[0]?'on':''}" onclick="ST.adm='${t[0]}';ST.edit=null;render()">${t[1]}</button>`).join('')}</div>${A[ST.adm]()}</div>`};

A.products=()=>{const e=ST.edit==='new'?{name:'',cat:'Dresses',price:'',sale:'',stock:10,colors:[],sizes:[...SZ],desc:'',new:true}:D.products.find(p=>p.id==ST.edit);
const form=e?`<form class="box" onsubmit="saveP(event)"><h3>${ST.edit==='new'?'Add product':'Edit product'}</h3><div class="f2"><div><label>Name</label><input name="name" required value="${esc(e.name)}"></div><div><label>Category</label><select name="cat">${CATS.filter(c=>c!='New Arrivals'&&c!='Sale').map(c=>`<option ${c==e.cat?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Price (LKR)</label><input name="price" type="number" min="1" required value="${e.price}"></div><div><label>Discount price (optional)</label><input name="sale" type="number" min="0" value="${e.sale||''}"></div><div><label>Stock</label><input name="stock" type="number" min="0" required value="${e.stock}"></div><div><label>Colours (comma separated)</label><input name="colors" required value="${e.colors.join(', ')}" placeholder="Black, Ivory"></div></div><label>Sizes</label><div class="opt">${SZ.map(s=>`<label style="color:var(--ink);margin:0"><input type="checkbox" name="sz" value="${s}" style="width:auto" ${e.sizes.includes(s)?'checked':''}> ${s}</label>`).join(' ')}</div><label>Description</label><textarea name="desc" rows="3">${esc(e.desc)}</textarea><label>Image (optional)</label><input type="file" name="img" accept="image/*"><label style="color:var(--ink)"><input type="checkbox" name="new" style="width:auto" ${e.new?'checked':''}> Show in New Arrivals</label><label style="color:var(--ink)"><input type="checkbox" name="best" style="width:auto" ${e.best?'checked':''}> Show in Best Sellers</label><br><button class="btn s">Save product</button> <button type="button" class="btn o s" onclick="ST.edit=null;render()">Cancel</button></form>`:'';
return`${form}<button class="btn s" onclick="ST.edit='new';render()">Add product</button><div class="tw"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${D.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.cat}</td><td>${p.sale?`<s class="mut">${p.price}</s> `:''}${LK(eff(p))}</td><td><input type="number" min="0" value="${p.stock}" style="width:70px;padding:5px" onchange="D.products.find(x=>x.id==${p.id}).stock=+this.value;save();toast('Stock updated')"></td><td><button class="chip" onclick="ST.edit=${p.id};render();scrollTo(0,0)">Edit</button> <button class="chip" onclick="if(confirm('Delete this product?')){D.products=D.products.filter(x=>x.id!=${p.id});save();render()}">Delete</button></td></tr>`).join('')}</table></div>`};
function shrink(file){return new Promise(r=>{if(!file||!file.size)return r(null);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(file)})}
async function saveP(e){e.preventDefault();const fd=new FormData(e.target),img=await shrink(fd.get('img')),sz=fd.getAll('sz');if(!sz.length)return toast('Select at least one size');
const v={name:fd.get('name'),cat:fd.get('cat'),price:+fd.get('price'),sale:+fd.get('sale')||0,stock:+fd.get('stock'),colors:fd.get('colors').split(',').map(s=>s.trim()).filter(Boolean).map(s=>s[0].toUpperCase()+s.slice(1).toLowerCase()),sizes:sz,desc:fd.get('desc'),new:!!fd.get('new'),best:!!fd.get('best')};v.colors.forEach(c=>{if(!HEX[c])HEX[c]='#bdb3a6'});
if(v.sale>=v.price)v.sale=0;if(ST.edit==='new')D.products.push({id:Math.max(0,...D.products.map(p=>p.id))+1,...v,img});else{const p=D.products.find(x=>x.id==ST.edit);Object.assign(p,v);if(img)p.img=img}save();ST.edit=null;toast('Product saved');render()}
A.orders=()=>D.orders.length?`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr>${D.orders.map(o=>`<tr><td>${o.id}<br><span class="sm mut">${new Date(o.date).toLocaleDateString()}</span></td><td>${esc(o.cust.name)}<br><span class="sm mut">${esc(o.cust.ph)} · ${esc(o.cust.dist)}<br>${esc(o.cust.addr)}</span></td><td class="sm">${o.items.map(i=>i.q+'× '+esc(i.name)+' ('+i.size+')').join('<br>')}</td><td>${LK(o.tot)}</td><td>${o.pay.toUpperCase()}${o.paid?' ✓':''}</td><td><select onchange="setS('${o.id}',this.value)">${STAT.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<p class="mut">No orders yet. New orders will show here.</p>';
function setS(id,s){const o=D.orders.find(x=>x.id==id);if(s=='Cancelled'&&o.status!='Cancelled')o.items.forEach(i=>{const p=D.products.find(x=>x.id==i.id);if(p)p.stock+=i.q});o.status=s;o.log.push([s,Date.now()]);save();toast('Order '+id+' is now '+s);render()}
A.customers=()=>{const c=D.users.filter(u=>u.role!='admin');return c.length?`<div class="tw"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Spent</th></tr>${c.map(u=>{const o=D.orders.filter(x=>x.user==u.id&&x.status!='Cancelled');return`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.ph)}</td><td>${o.length}</td><td>${LK(o.reduce((a,x)=>a+x.tot,0))}</td></tr>`}).join('')}</table></div>`:'<p class="mut">No registered customers yet.</p>'};
A.promos=()=>`<form class="box" onsubmit="event.preventDefault();const f=new FormData(this),c=f.get('c').toUpperCase().trim();if(D.promos.some(p=>p.code==c))return toast('Code already exists');D.promos.push({code:c,pct:+f.get('p'),on:true});save();render()"><h3>New promo code</h3><div class="f2"><div><label>Code</label><input name="c" required placeholder="EID15"></div><div><label>Discount %</label><input name="p" type="number" min="1" max="90" required></div></div><br><button class="btn s">Create offer</button></form><div class="tw"><table><tr><th>Code</th><th>Discount</th><th>Status</th><th></th></tr>${D.promos.map((p,i)=>`<tr><td>${p.code}</td><td>${p.pct}%</td><td>${p.on?'Active':'Paused'}</td><td><button class="chip" onclick="D.promos[${i}].on=!D.promos[${i}].on;save();render()">${p.on?'Pause':'Activate'}</button> <button class="chip" onclick="D.promos.splice(${i},1);save();render()">Delete</button></td></tr>`).join('')}</table></div><p class="sm mut">To discount a single product, set its discount price in Products.</p>`;
